 last<br/>Deadline 300 seconds\"]\n    OFF[\"Lab off\"]\n    FAIL[\"Phase timeout or action failure<br/>Visible notice; no automatic force-off\"]:::pending\n    subgraph EXEC[\"Scenario command paths\"]\n        BTN[\"Explicit scenario action\"]\n        LJOB[\"Linux background job\"]\n        WRAP[\"SSH labadmin<br/>sudo -n lab-scenario Sx mode\"]\n        LS[\"Installed Linux scenario driver\"]\n        WJOB[\"Windows background job\"]\n        WDIRECT[\"SSH Administrator<br/>Guest credential, temporary script\"]\n        WS[\"Windows scenario driver\"]\n    end\n    CLICK --> MSTART --> SSHWAIT --> SVCWAIT --> ESTART --> AGWAIT --> READY\n    READY --> DOWN --> EOFF --> MOFF --> OFF\n    SSHWAIT -.->|timeout| FAIL\n    SVCWAIT -.->|timeout| FAIL\n    AGWAIT -.->|timeout| FAIL\n    BTN --> LJOB --> WRAP --> LS\n    BTN --> WJOB --> WDIRECT --> WS\n    classDef pending fill:#fff3db,stroke:#a66516,color:#533600\n    classDef store fill:#e7f2eb,stroke:#487b60,color:#173b29","svg":"<svg id=\"arch6\" width=\"3549.03125\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" height=\"775.375\" viewBox=\"0 0 3549.03125 775.375\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\" style=\"background-color: transparent;\"><style>#arch6{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#172b44;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#arch6 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#arch6 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#arch6 .error-icon{fill:#f7f9fc;}#arch6 .error-text{fill:#080603;stroke:#080603;}#arch6 .edge-thickness-normal{stroke-width:1px;}#arch6 .edge-thickness-thick{stroke-width:3.5px;}#arch6 .edge-pattern-solid{stroke-dasharray:0;}#arch6 .edge- ad\"]\n    EVAL[\"evaluate.py<br/>Eight outer held-out networks<br/>Three GRU seeds per fold\"]\n    FOLDS[(\"data/ait/folds.jsonl<br/>Per-model F1 and AP\")]\n    PT[(\"models/alert_gru_*.pt<br/>Offline experiment only\")]\n    EXPORT[\"export-model.py<br/>Fit portable logistic on seven networks<br/>Select cutoff on Wilson\"]\n    PARITY[\"Feature parity check<br/>features.py versus scorer/score.py\"]\n    MODEL[(\"scorer/model.json<br/>Columns, means, scales, weights<br/>Bias, cutoff and provenance\")]\n    DASH[\"Dashboard startup<br/>Embeds score.py and model.json\"]\n    AIT --> IMPORT --> CACHE --> WINDOWS --> EPS\n    SYN --> EPS\n    FUTURE -.-> EPS\n    EPS --> SPLIT\n    SPLIT --> COUNTS --> BASE\n    SPLIT --> SHAPE --> BASE\n    SPLIT --> SEQ --> GRU --> PT\n    COUNTS --> EVAL\n    SHAPE --> EVAL\n    SEQ --> EVAL --> FOLDS\n    EPS --> EXPORT\n    FOLDS --> EXPORT\n    EXPORT --> PARITY --> MODEL --> DASH\n    classDef pending fill:#fff3db,stroke:#a66516,color:#533600\n    classDef store fill:#e7f2eb,stroke:#487b60,color:#173b29\n    class CACHE,EPS,FOLDS,PT,MODEL store","svg":"<svg id=\"arch7\" width=\"3765.59375\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" height=\"594.8695678710938\" viewBox=\"0 0 3765.59375 594.8695678710938\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\" style=\"background-color: transparent;\"><style>#arch7{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#172b44;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#arch7 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#arch7 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#arch7 .error-icon{fill:#f7f9fc;}#arch7 .error-text{fill:#080603;stroke:#080603;}#arch7 .edge-thickness- 3529411765)\"/><g class=\"label\" style=\"color:#173b29 !important\" transform=\"translate(-100, -35)\"><rect/><foreignObject width=\"200\" height=\"90\"><div style=\"color: rgb(23, 59, 41) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span style=\"color:#173b29 !important\" class=\"nodeLabel\"><p>scorer/model.json<br />Columns, means, scales, weights<br />Bias, cutoff and provenance</p></span></div></foreignObject></g></g><g class=\"node default\" id=\"arch7-flowchart-DASH-19\" data-look=\"classic\" transform=\"translate(3627.59375, 424.3695812225342)\"><rect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-48.75\" width=\"260\" height=\"97.5\"/><g class=\"label\" style=\"\" transform=\"translate(-100, -33.75)\"><rect/><foreignObject width=\"200\" height=\"67.5\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel\"><p>Dashboard startup<br />Embeds score.py and model.json</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"arch7-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/></filter></defs><defs><filter id=\"arch7-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/></filter></defs><linearGradient id=\"arch7-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#547396\" stop-opacity=\"1\"/><stop offset=\"100%\" stop-color=\"hsl(216, 5.4545454545%, 87.8431372549%)\" stop-opacity=\"1\"/></linearGradient></svg>"},{"title":"Manager-side scoring and severity calculation","name":"09-manager-side-scoring-and-severity-calculation","code":"flowchart LR\n    HOST[\"Host loads score.py and model.json<br/>Once at dashboard startup\"]\n    ENCODE[\"Substitute into status script<br/>Base64-encode payload\"]\n    SSH[\"SSH: execute Python from stdin<br/>On manager, as labadmin\"]\n    SEARCH[\"lab-dashboard-indexer alerts N<br/>Authenticated search over mTLS, 90 minutes\"]\n    TAIL[\"Fallback: alerts.json tail<br/>Last 400 KB, at most 800 lines, flagged truncated\"]\n    PARSE[\"Parse timestamp, rule, level, agent<br/>Tactics, techniques and description\"]\n    BUCKET[\"Epoch-aligned five-minute buckets<br/>Split per endpoint\"]\n    FEATURES[\"Eleven aggregate features\"]\n    STANDARD[\"Standardize with saved mean and SD\"]\n    LOGISTIC[\"Dot product plus bias<br/>Clamp logit and apply sigmoid\"]\n    OBS[\"Completed windows that have scrolled off the chart<br/>Count, peak, mass, burst, distinct, probability, rules\"]\n    BASEH[\"lab-dashboard-baseline<br/>Prints the state before folding these in\"]\n    BASE[(\"/var/lib/wazuh-lab/baseline.json<br/>Per endpoint: samples, hours, rules\")]\n    DEN[\"Four of six denominators from this endpoint<br/>Median plus three robust SD, floored at the fixed value\"]\n    NOV[\"Novelty and routine<br/>Rules new to the endpoint up, its daily traffic down\"]\n    HEURISTIC[\"Six-term severity, per endpoint<br/>Model is one component\"]\n    CO[\"Credential and persistence on one endpoint<br/>Tactics or lab rule IDs<br/>Multiplier from 1.15 to 1.30\"]\n    WARM[\"Under 24 windows: fixed constants stand<br/>The panel says which mode it is in\"]\n    PARTIAL[\"Current logic: newest event bucket<br/>Marked partial until later event arrives\"]:::pending\n    DISPLAY[\"Last twelve nonempty buckets<br/>Worst endpoint leads, every endpoint reported\"]\n    FIND[\"Completed bucket with severity at least 50<br/>Ranked finding and rule breakdown\"]\n    JSON[\"Status JSON over SSH<br/>Cached on host for 10 seconds\"]\n    PAGE[\"Browser chart and explanations\"]\n    PD
